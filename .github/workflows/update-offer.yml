name: Update offer

on:
  schedule:
    - cron: "0 22 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  pages: write

concurrency:
  group: update-offer
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test the parsers and validators
        run: python3 -m unittest discover -s scripts/tests -t scripts

      - name: Install pdftotext
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils

      - name: Read the current offer from issue letters
        run: python3 scripts/fetch_offer.py

      - name: Validate offer files
        run: python3 scripts/validate_offer.py v1/offer.json v1/offers/*.json

      - name: Validate the offer archive
        run: python3 scripts/validate_offer_archive.py v1

      - name: Merge a pull request when the offer changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "Offer unchanged"
            exit 0
          fi

          month=$(python3 -c "import json; print(json.load(open('v1/offer.json'))['month'])")
          branch="offer/$month"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$branch"
          git add v1
          git commit --message "Update offer to $month"
          git push --force origin "$branch"

          if [ -z "$(gh pr list --head "$branch" --json number --jq '.[].number')" ]; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title "Update offer to $month" \
              --body "New monthly offer read from the issue letters on obligacjeskarbowe.pl and the NBP reference rate. Validated and merged automatically."
          fi

          gh pr merge "$branch" --rebase --delete-branch
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
